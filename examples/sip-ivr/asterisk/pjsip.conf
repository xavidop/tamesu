; Asterisk as the carrier and the IVR for the sip example. The LiveKit SIP
; service is the only peer: calls from it (tamesu dialing the IVR) land in
; the tamesu-ivr context; calls to it (the inbound test) go through the
; livekit-sip endpoint.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[livekit-sip]
type=endpoint
context=tamesu-ivr
disallow=all
allow=ulaw
allow=alaw
aors=livekit-sip
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
from_user=tamesu-ivr

[livekit-sip]
type=aor
contact=sip:sip:5060

[livekit-sip]
type=identify
endpoint=livekit-sip
match=0.0.0.0/0
