; The IVR under test: answer, greet, read one digit; 2 reaches "billing",
; which sends a DTMF 9 back (so dtmf_received has something to check), thanks
; the caller and hangs up. Anything else says goodbye and hangs up. The
; prompts are the WAV files in ./sounds (8 kHz mono, generated with macOS
; `say`, mounted as the "en" sound set by ../../compose.yaml): the stock
; Asterisk image ships no sounds. Each prompt is one continuous utterance and
; the menu plays no beep, so a call is exactly two speech segments for the VAD
; (greeting, then billing+goodbye) and the fake STT script replays in step.
[general]
static=yes
writeprotect=yes

[tamesu-ivr]
exten => _[+0-9].,1,NoOp(tamesu IVR: call to ${EXTEN} from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(2)
 same => n,Playback(tamesu-greeting)
 same => n,Read(choice,,1,,1,6)
 same => n,GotoIf($["${choice}" = "2"]?billing)
 same => n,Playback(tamesu-goodbye)
 same => n,Hangup()
 same => n(billing),SendDTMF(9,250)
 same => n,Playback(tamesu-billing)
 same => n,Wait(1)
 same => n,Hangup()

; The inbound test: tamesu asks Asterisk (channel originate) to call the
; LiveKit SIP inbound number; once answered this plays the same menu.
[tamesu-callback]
exten => s,1,NoOp(tamesu callback: dialing out as the agent)
 same => n,Wait(2)
 same => n,Playback(tamesu-greeting)
 same => n,Read(choice,,1,,1,6)
 same => n,GotoIf($["${choice}" = "2"]?billing)
 same => n,Playback(tamesu-goodbye)
 same => n,Hangup()
 same => n(billing),SendDTMF(9,250)
 same => n,Playback(tamesu-billing)
 same => n,Wait(1)
 same => n,Hangup()
