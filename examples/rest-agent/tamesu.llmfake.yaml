# Project configuration for CI: the fake model provider, which needs a tamesu
# binary built with -tags llmfake. No network, no keys.
version: 1
suites: ["suite.yaml"]
genkit:
  plugins: [fake]
models:
  default: fake/text
  simulator: fake/simulator
  judge: fake/judge
  scenario_generator: fake/generate
  embedder: fake/embedding
defaults: { timeout: 1m, repeat: 1 }
budgets: { max_cost_usd: 1 }
reporters: [console, junit]
