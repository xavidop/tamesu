# The example suite: tests the rest-agent (examples/rest-agent) over HTTP.
# Run it with `tamesu run --config examples/rest-agent/tamesu.yaml` (real
# models) or `tamesu run --config examples/rest-agent/tamesu.llmfake.yaml`
# with a binary built with -tags llmfake (no network, no keys).
suite: rest-agent
tags: [smoke, example]

targets:
  api:
    type: rest
    url: ${AGENT_URL:-http://localhost:8080/chat}
    method: POST
    request:
      body: { session_id: "{{session}}", message: "{{message}}" }
    response:
      text: $.reply
      tool_calls: $.tool_calls[*]
      done: $.end_session
    handoff: { tool: transfer_to_human, to: department, summary: summary }   # how this agent escalates
    session: { id: "{{uuid}}" }

  ws:                                             # the same agent over a websocket
    type: rest
    url: ${AGENT_WS_URL:-ws://localhost:8080/ws}
    streaming: websocket
    request:
      body: { session_id: "{{session}}", message: "{{message}}" }
    response:
      text: $.delta                               # applied to every message, deltas concatenated
      tool_calls: $.tool_calls[*]
      turn_done: $.done                           # the message that ends a turn
      done: $.end_session                         # ... and the one that ends the session
      idle: 2s                                    # otherwise a turn ends after this silence

  agent_grpc:                                     # the same agent behind tamesu's gRPC turn API
    type: grpc
    url: ${AGENT_GRPC_URL:-grpc://localhost:9090}

tests:
  - name: refund policy question
    target: api
    persona:
      name: Marta
      style: "polite, slightly confused"
      language: en
    scenario:
      goal: "Find out if you can return shoes bought 40 days ago"
      max_turns: 6
      stop_when: "the agent has given a clear yes/no answer"
    capture:
      - { name: session, json_path: $.session_id }    # the agent echoes the session id
    assert:
      - judge: "The agent states the 30-day return policy and does not promise an exception"
      # The backend's own record of the conversation, not the transcript: the policy was looked
      # up and no refund was granted (a 10% voucher at most).
      - http:
          url: ${AGENT_BASE_URL:-http://localhost:8080}/sessions/{{captured.session}}
          json_path: { path: "$.tool_calls[0]", equals: lookup_policy }
      - http: { url: "${AGENT_BASE_URL:-http://localhost:8080}/sessions/{{captured.session}}", regex: '"vouchers":[01]' }
      - not_contains: "I'm just an AI"
      - similar_to: { text: "The return window is 30 days from delivery, so returning after 40 days is not possible", min: 0.6 }
      - tool_called: { name: lookup_policy, schema: { type: object, required: [topic], properties: { topic: { type: string } } } }
      - status: 200
      - json_path: { path: $.session_id }
      - metric: { name: turn_latency_ms_p95, lt: 4000 }
      - turns: { lte: 6 }

  - name: refund policy question over websocket
    target: ws
    tags: [websocket]
    persona:
      name: Ken
      style: in a hurry
      language: en
    scenario:
      goal: "Find out if you can return shoes bought 40 days ago"
      max_turns: 4
    assert:
      - contains: "30 days"
      - judge: "The agent states the 30-day return policy"
      - tool_called: lookup_policy
      - metric: { name: time_to_first_token_ms_p95, lt: 2000 }
      - turns: { lte: 4 }

  - name: refund policy question over grpc
    target: agent_grpc
    tags: [grpc]
    persona:
      name: Ana
      style: direct
      language: en
    scenario:
      goal: "Find out if you can return shoes bought 40 days ago"
      max_turns: 4
    assert:
      - contains: "30 days"
      - judge: "The agent states the 30-day return policy"
      - tool_called: lookup_policy
      - metric: { name: time_to_first_token_ms_p95, lt: 2000 }
      - turns: { lte: 4 }

  - name: asks for a person
    target: api
    tags: [handoff]
    scenario:
      script:
        - say: "I want to speak to a real person, not a bot."
    assert:
      - handoff: { within_turns: 1, to: "^support$", summary_contains: ["asked to speak to a person"] }
      - pack: discloses_ai
      - metric: { name: handoff_turn, eq: 1 }

  - name: a shipping question stays with the agent
    target: api
    tags: [handoff]
    scenario:
      script:
        - say: "How long does shipping take?"
    assert:
      - contains: "business days"
      - handoff: false
