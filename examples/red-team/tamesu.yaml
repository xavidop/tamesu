# Project configuration for the red-team example with real models. Needs GEMINI_API_KEY
# and the rest-agent running (go run ./examples/rest-agent).
version: 1
suites: ["suite.yaml"]
genkit:
  plugins: [googlegenai]
models:
  default: googleai/gemini-2.5-flash
  simulator: googleai/gemini-2.5-flash
  judge: googleai/gemini-2.5-flash
defaults: { timeout: 2m, repeat: 3, pass_threshold: 1 }
budgets: { max_cost_usd: 2 }
reporters: [console, junit, html]
secrets:
  GEMINI_API_KEY: env:GEMINI_API_KEY
