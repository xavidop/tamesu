# Project configuration with a real model: the browser agent and the judge on
# Gemini. The fake-provider variant for CI is tamesu.llmfake.yaml.
version: 1
suites: ["suite.yaml"]
genkit:
  plugins: [googlegenai]
models:
  default: googleai/gemini-2.5-flash
  judge: googleai/gemini-2.5-flash
  browser_agent: googleai/gemini-2.5-pro
defaults: { timeout: 3m, repeat: 1, max_goal_steps: 15 }
budgets: { max_cost_usd: 2 }
reporters: [console, junit]
secrets:
  GEMINI_API_KEY: env:GEMINI_API_KEY
