version: 2
updates:
  # Every Go module, in one entry so that Dependabot groups an update across
  # modules into a single PR: the monorepo has a module per target, per speech
  # plugin and per example, and one Genkit release used to open a PR in each.
  # .github/scripts/check_dependabot_coverage.py keeps this list equal to the
  # modules CI discovers (CI fails when a module is missing or stale here).
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/audio"
      - "/cmd/tamesu"
      - "/examples/a2a-agent"
      - "/examples/livekit-agent"
      - "/examples/mcp-server"
      - "/examples/rest-agent"
      - "/examples/webapp"
      - "/llm"
      - "/llm/plugins/assemblyai"
      - "/llm/plugins/azure"
      - "/llm/plugins/cartesia"
      - "/llm/plugins/deepgram"
      - "/llm/plugins/elevenlabs"
      - "/llm/plugins/gladia"
      - "/llm/plugins/googlespeech"
      - "/llm/plugins/openaispeech"
      - "/llm/plugins/rime"
      - "/llm/plugins/soniox"
      - "/llm/plugins/speechstream"
      - "/llm/plugins/speechmatics"
      - "/targets/a2a"
      - "/targets/browser"
      - "/targets/grpc"
      - "/targets/livekit"
      - "/targets/mcp"
      - "/targets/model"
      - "/targets/pipecat"
      - "/targets/realtime"
      - "/targets/rest"
      - "/targets/sip"
      - "/targets/twilio"
      - "/targets/voice"
    schedule: { interval: weekly }
    groups:
      # Genkit and its plugins move together; the speech plugins build on
      # them alone.
      genkit:
        patterns: ["github.com/firebase/genkit", "github.com/firebase/genkit/*"]
      # LiveKit and pion are one stack (targets/livekit, sip, voice).
      livekit:
        patterns: ["github.com/livekit/*", "github.com/pion/*"]
      # Everything else in one weekly PR.
      go-dependencies:
        patterns: ["*"]
    labels: [dependencies, go]

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]

  # Docs site (npm)
  - package-ecosystem: npm
    directory: "/site"
    schedule: { interval: weekly }
    labels: [dependencies, docs]
    groups:
      npm-dependencies:
        patterns: ["*"]
