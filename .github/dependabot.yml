version: 2
updates:
  # Root module (public API, target/assert/metrics contracts, internal/*)
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
    labels: [dependencies, go]
    # The workspace makes this entry reach every module; chromedp 0.17+ is a
    # new API the browser target has to be ported to on purpose.
    ignore:
      - dependency-name: github.com/chromedp/chromedp
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: github.com/chromedp/cdproto

  # CLI module (own go.mod; the only module that pulls everything, including
  # the mamori cloud secret providers)
  - package-ecosystem: gomod
    directory: "/cmd/tamesu"
    schedule: { interval: weekly }
    labels: [dependencies, go, cli]
    ignore:
      - dependency-name: github.com/chromedp/chromedp
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: github.com/chromedp/cdproto

  # AI layer (own go.mod; Genkit and the model provider plugins)
  - package-ecosystem: gomod
    directory: "/llm"
    schedule: { interval: weekly }
    labels: [dependencies, go, llm]

  # REST target (own go.mod; net/http and ojg for JSONPath)
  - package-ecosystem: gomod
    directory: "/targets/rest"
    schedule: { interval: weekly }
    labels: [dependencies, go, target]

  # LiveKit target (own go.mod; LiveKit Go SDK, pion)
  - package-ecosystem: gomod
    directory: "/targets/livekit"
    schedule: { interval: weekly }
    labels: [dependencies, go, target]

  # Browser target (own go.mod; chromedp pinned to the v0.16 line: v0.17 rewrote
  # the API around generics and the driver targets the classic one)
  - package-ecosystem: gomod
    directory: "/targets/browser"
    schedule: { interval: weekly }
    labels: [dependencies, go, target]
    ignore:
      - dependency-name: github.com/chromedp/chromedp
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: github.com/chromedp/cdproto

  # Realtime target (own go.mod; coder/websocket for the OpenAI Realtime protocol)
  - package-ecosystem: gomod
    directory: "/targets/realtime"
    schedule: { interval: weekly }
    labels: [dependencies, go, target]

  # Pipecat target (own go.mod; coder/websocket and protobuf)
  - package-ecosystem: gomod
    directory: "/targets/pipecat"
    schedule: { interval: weekly }
    labels: [dependencies, go, target]

  # Model target (own go.mod; only the root module)
  - package-ecosystem: gomod
    directory: "/targets/model"
    schedule: { interval: weekly }
    labels: [dependencies, go, target]

  # gRPC target (own go.mod; grpc-go and protobuf)
  - package-ecosystem: gomod
    directory: "/targets/grpc"
    schedule: { interval: weekly }
    labels: [dependencies, go, target]

  # SIP target (own go.mod; LiveKit Go SDK, on top of targets/livekit)
  - package-ecosystem: gomod
    directory: "/targets/sip"
    schedule: { interval: weekly }
    labels: [dependencies, go, target]

  # Deepgram STT Genkit plugin (own go.mod; Genkit only)
  - package-ecosystem: gomod
    directory: "/llm/plugins/deepgram"
    schedule: { interval: weekly }
    labels: [dependencies, go, ai]

  # ElevenLabs TTS Genkit plugin (own go.mod; Genkit only)
  - package-ecosystem: gomod
    directory: "/llm/plugins/elevenlabs"
    schedule: { interval: weekly }
    labels: [dependencies, go, ai]

  # Audio pipeline (own go.mod; onnxruntime_go behind -tags onnx, libopus via cgo)
  - package-ecosystem: gomod
    directory: "/audio"
    schedule: { interval: weekly }
    labels: [dependencies, go, audio]

  # Example web shop for the browser suite (own go.mod; standard library only)
  - package-ecosystem: gomod
    directory: "/examples/webapp"
    schedule: { interval: weekly }
    labels: [dependencies, go, examples]

  # Example LiveKit agent (own go.mod; LiveKit Go SDK and Genkit)
  - package-ecosystem: gomod
    directory: "/examples/livekit-agent"
    schedule: { interval: weekly }
    labels: [dependencies, go, examples]

  # Example REST agent (own go.mod; a Genkit app)
  - package-ecosystem: gomod
    directory: "/examples/rest-agent"
    schedule: { interval: weekly }
    labels: [dependencies, go, examples]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    labels: [dependencies, ci]

  # Docs site (npm)
  - package-ecosystem: npm
    directory: "/site"
    schedule: { interval: weekly }
    labels: [dependencies, docs]
