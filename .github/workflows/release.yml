name: Release

# Releases are driven by Conventional Commits:
#   0. A snapshot of the tamesu CLI is built and smoke-tested (`tamesu
#      version`) before anything is tagged.
#   1. semantic-release analyzes commits on main, decides the next version,
#      updates CHANGELOG.md, and creates + pushes the git tag (vX.Y.Z).
#   2. GoReleaser builds tamesu-lite (CGO_ENABLED=0, cross-compiled) and
#      creates the GitHub Release with the archives, deb/rpm/apk packages,
#      checksums, SBOMs and the Docker image, and updates the Homebrew cask
#      and the Scoop manifest.
#   3. The full tamesu build (audio mode and SIP need CGO) runs on a native
#      runner per OS/arch with `goreleaser build --single-target`, and the
#      publish job uploads the archives to the same release.
#   4. SLSA provenance is generated for the released artifacts.
#
# Run it by hand with a tag (workflow_dispatch, input `tag`) to publish a tag
# that already exists but has no GitHub Release, for instance after
# GoReleaser failed: the tag is checked out and only steps 2 to 4 run.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag (vX.Y.Z) to publish with GoReleaser, skipping semantic-release"
        required: false
        default: ""

permissions:
  contents: write # create tags, releases, and commit the changelog
  issues: write # semantic-release success comments
  pull-requests: write
  id-token: write # SLSA / keyless signing
  packages: write # the Docker image on ghcr.io

jobs:
  release:
    name: Version & lite build
    runs-on: ubuntu-latest
    env:
      RETAG: ${{ inputs.tag }}
      # Unset: the CGO build is skipped here and runs in the native job.
      TAMESU_CGO: ""
    outputs:
      published: ${{ inputs.tag != '' && 'true' || steps.semantic.outputs.new_release_published }}
      tag: ${{ inputs.tag != '' && inputs.tag || steps.semantic.outputs.new_release_git_tag }}
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so semantic-release can analyze commits
          persist-credentials: true
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Check the tag to publish
        if: env.RETAG != ''
        run: |
          [[ "$RETAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like vX.Y.Z"; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RETAG^{commit}")"

      - uses: actions/setup-go@v7
        with:
          go-version-file: cmd/tamesu/go.mod
          cache-dependency-path: cmd/tamesu/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 0. Smoke-test a snapshot build for this runner BEFORE semantic-release
      #    runs: semantic-release pushes the tag and the CHANGELOG commit as
      #    soon as it runs, so a binary that does not start must stop the job
      #    while nothing has been tagged or published yet. (Casks have no test
      #    block, so this is the only check that the released binary runs.)
      - name: Build a snapshot for the smoke test
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --single-target --id tamesu-lite

      - name: Smoke-test the snapshot binary
        run: |
          bin=$(find dist -type f -name tamesu | head -n 1)
          test -n "$bin"
          "$bin" version
          d=$(mktemp -d) && cd "$d" && "$bin" init && "$bin" validate --strict

      # 1. Determine the next version, update CHANGELOG.md, create and push the tag.
      - name: Semantic Release
        id: semantic
        if: env.RETAG == ''
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Build and publish the GitHub Release for the tag semantic-release created.
      - name: Run GoReleaser
        if: env.RETAG != '' || steps.semantic.outputs.new_release_published == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Homebrew cask is committed to xavidop/homebrew-tap, a
          # different repository, which GITHUB_TOKEN cannot write to.
          # HOMEBREW_TAP_TOKEN must be a PAT (or GitHub App token) with
          # contents:write on the tap repo. The fallback keeps the variable
          # defined: .goreleaser.yaml interpolates it, and an undefined env var
          # there is a template error that would fail the ENTIRE release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
          # The Scoop manifest goes to xavidop/scoop-bucket the same way. A PAT
          # that covers both repositories can be set as HOMEBREW_TAP_TOKEN alone.
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN || secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}

      # 3. Export the artifact hashes for the provenance job.
      - name: Export artifact hashes
        id: hashes
        if: env.RETAG != '' || steps.semantic.outputs.new_release_published == 'true'
        run: echo "hashes=$(base64 -w0 < dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  # The full build needs CGO (onnxruntime for VAD, opus), so it cannot be
  # cross-compiled: each platform builds natively with goreleaser's
  # --single-target and packages the binary the way the lite archives are.
  native:
    name: Full build ${{ matrix.os }}
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
    env:
      TAMESU_CGO: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: cmd/tamesu/go.mod
          cache-dependency-path: cmd/tamesu/go.sum
      # audio/opus links libopus through pkg-config.
      - name: Install libopus (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopus-dev pkg-config
      - name: Install libopus (macOS)
        if: runner.os == 'macOS'
        run: brew install opus pkgconf
      - name: Install libopus (Windows, MSYS2)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-opus mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-gcc
      - name: Put MSYS2 on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin" >> "$GITHUB_PATH"
      - name: goreleaser build (native, cgo)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --clean --single-target --id tamesu
      - name: Package the binary
        shell: bash
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          goos="$(go env GOOS)"; goarch="$(go env GOARCH)"
          bin=$(find dist -type f \( -name tamesu -o -name tamesu.exe \) | head -n 1)
          test -n "$bin"
          "$bin" version
          name="tamesu_${version}_${goos}_${goarch}"
          mkdir -p "native/$name"
          cp "$bin" LICENSE README.md "native/$name/"
          cp -r completions "native/$name/"
          cd native
          if [ "$goos" = "windows" ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}
          path: native/*
          retention-days: 7

  publish:
    name: Upload the full build
    needs: [release, native]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - name: Checksums of the full build
        working-directory: native
        run: sha256sum tamesu_* > checksums-full.txt && cat checksums-full.txt
      - name: Upload to the release
        working-directory: native
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" tamesu_* checksums-full.txt --clobber

  provenance:
    name: SLSA provenance
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.release.outputs.tag }}
      provenance-name: tamesu.intoto.jsonl
