  speechmatics/enhanced: { per_minute: 0.0083 }
  speechmatics/: { per_minute: 0.005 }
  gladia/: { per_minute: 0.0102 }
  # Cartesia bills credits (about 1 per character spoken, 1 per 2 seconds
  # transcribed); these are the Scale plan's dollars per credit.
  cartesia/ink: { per_minute: 0.0011 }
  cartesia/: { per_character: 0.00004 }
  # Soniox real-time (stt-rt-*) and async (stt-async-*) models.
  soniox/stt-rt: { per_minute: 0.002 }
  soniox/: { per_minute: 0.0017 }
  ollama/: { input: 0, output: 0 }
  fake/tts: { per_character: 0.0001 }
  fake/stt: { per_minute: 0.01 }
  fake/: { input: 1.00, output: 2.00 }
