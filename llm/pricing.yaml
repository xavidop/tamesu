  elevenlabs/eleven_flash: { per_character: 0.00015 }
  elevenlabs/eleven_turbo: { per_character: 0.00015 }
  elevenlabs/: { per_character: 0.00030 }
  deepgram/nova-3: { per_minute: 0.0077 }
  deepgram/: { per_minute: 0.0058 }
