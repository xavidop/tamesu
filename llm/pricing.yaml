# Prices in USD per million tokens (input/output), per character spoken
# (per_character, TTS) and per minute heard (per_minute, STT), used to estimate
# tamesu's own spend and enforce budgets. Keys are Genkit model references; a model not listed is
# priced by its longest listed prefix, and an unknown model costs 0 (the token
# counts are still reported). Update when providers change their list prices.
models:
  googleai/gemini-2.5-pro: { input: 1.25, output: 10.00 }
  googleai/gemini-2.5-flash: { input: 0.30, output: 2.50 }
  googleai/gemini-2.5-flash-lite: { input: 0.10, output: 0.40 }
  googleai/gemini-2.0-flash: { input: 0.10, output: 0.40 }
  anthropic/claude-opus-4: { input: 15.00, output: 75.00 }
  anthropic/claude-sonnet-4: { input: 3.00, output: 15.00 }
  anthropic/claude-3-5-haiku: { input: 0.80, output: 4.00 }
  anthropic/claude-haiku-4: { input: 1.00, output: 5.00 }
  googleai/text-embedding-004: { input: 0.15, output: 0 }
  googleai/gemini-embedding-001: { input: 0.15, output: 0 }
  openai/text-embedding-3-small: { input: 0.02, output: 0 }
  openai/text-embedding-3-large: { input: 0.13, output: 0 }
  openai/gpt-4.1: { input: 2.00, output: 8.00 }
  openai/gpt-4.1-mini: { input: 0.40, output: 1.60 }
  openai/gpt-4.1-nano: { input: 0.10, output: 0.40 }
  openai/gpt-4o: { input: 2.50, output: 10.00 }
  openai/gpt-4o-mini: { input: 0.15, output: 0.60 }
  openai/o4-mini: { input: 1.10, output: 4.40 }
  googleai/gemini-2.5-flash-preview-tts: { input: 0.50, output: 10.00 }
  googleai/gemini-2.5-pro-preview-tts: { input: 1.00, output: 20.00 }
  elevenlabs/eleven_flash: { per_character: 0.00015 }
  elevenlabs/eleven_turbo: { per_character: 0.00015 }
  elevenlabs/scribe: { per_minute: 0.0067 }
  elevenlabs/: { per_character: 0.00030 }
  deepgram/nova-3: { per_minute: 0.0077 }
  # Aura voices are models of their own (aura-2-thalia-en); the family prefix
  # prices them all.
  deepgram/aura-2: { per_character: 0.00003 }
  deepgram/aura: { per_character: 0.000015 }
  deepgram/: { per_minute: 0.0058 }
  openai/gpt-4o-mini-tts: { per_character: 0.000015 }
  openai/tts-1-hd: { per_character: 0.00003 }
  openai/tts-1: { per_character: 0.000015 }
  openai/gpt-4o-transcribe: { per_minute: 0.006 }
  openai/gpt-4o-mini-transcribe: { per_minute: 0.003 }
  openai/whisper-1: { per_minute: 0.006 }
  # Azure bills neural voices per character and fast transcription per hour.
  azure/tts: { per_character: 0.000015 }
  azure/stt: { per_minute: 0.006 }
  assemblyai/nano: { per_minute: 0.002 }
  assemblyai/: { per_minute: 0.0025 }
  # Rime list prices are approximate; update from the account's plan.
  rime/arcana: { per_character: 0.0001 }
  rime/: { per_character: 0.00005 }
  # Google Cloud Text-to-Speech bills per character by voice family and
  # Speech-to-Text v2 per minute (list prices).
  google/chirp3-hd: { per_character: 0.00003 }
  google/neural2: { per_character: 0.000016 }
  google/studio: { per_character: 0.00016 }
  google/wavenet: { per_character: 0.000016 }
  google/standard: { per_character: 0.000004 }
  google/: { per_minute: 0.016 }
