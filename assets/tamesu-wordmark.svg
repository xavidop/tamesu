<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="t">
  <title id="t">tamesu logo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2A5A"/>
      <stop offset="1" stop-color="#2E3F86"/>
    </linearGradient>
  </defs>

  <!-- Mark: a hanko-style seal with a waveform that resolves into a check -->
  <g transform="translate(20,20)">
    <rect width="160" height="160" rx="36" fill="url(#bg)"/>
    <!-- vermilion sun disc -->
    <circle cx="112" cy="50" r="18" fill="#E5482F"/>
    <!-- waveform (voice) flowing into a check mark (test passed) -->
    <path d="M24 92 L38 92 L46 74 L54 112 L62 82 L70 100 L78 92 L88 92 L104 118 L138 66"
          fill="none" stroke="#F7F3EA" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- cursor dot (browser) -->
    <circle cx="138" cy="66" r="7" fill="#E5482F"/>
    <!-- seal border, like a hanko stamp -->
    <rect x="8" y="8" width="144" height="144" rx="28" fill="none"
          stroke="#F7F3EA" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="210" y="112" font-size="72" font-weight="800" fill="#1E2A5A" letter-spacing="-1">tamesu</text>
    <text x="212" y="152" font-size="24" font-weight="500" fill="#6B7280">試す · agentic tests for web &amp; agents</text>
  </g>
  <rect x="210" y="128" width="40" height="5" rx="2.5" fill="#E5482F"/>
</svg>
